<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ثبت ورود و خروج</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f2f4f7;
      color: #222;
    }

    .container {
      max-width: 500px;
      margin: 25px auto;
      padding: 15px;
    }

    .card {
      background: white;
      padding: 22px;
      border-radius: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      margin-top: 0;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 17px;
      background: white;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      border: none;
      border-radius: 12px;
      font-size: 17px;
      cursor: pointer;
    }

    .save {
      background: #2563eb;
      color: white;
    }

    .clear {
      background: #555;
      color: white;
    }

    .status {
      text-align: center;
      margin-top: 15px;
      font-weight: bold;
      min-height: 25px;
    }

    .table-box {
      overflow-x: auto;
      margin-top: 25px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 350px;
    }

    th, td {
      padding: 10px 5px;
      border-bottom: 1px solid #ddd;
      text-align: center;
    }

    th {
      background: #f1f1f1;
    }

    .today {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
      color: #555;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="card">

    <h1>🕐 ثبت ورود و خروج</h1>

    <div class="today" id="todayText"></div>

    <label for="dateInput">📅 تاریخ</label>
    <input type="text" id="dateInput" placeholder="مثلاً 1405/07/12">

    <label for="entryInput">🟢 ساعت ورود</label>
    <input type="time" id="entryInput">

    <label for="exitInput">🔴 ساعت خروج</label>
    <input type="time" id="exitInput">

    <button class="save" onclick="saveRecord()">
      💾 ثبت اطلاعات
    </button>

    <div class="status" id="status"></div>

    <div class="table-box">
      <table>
        <thead>
          <tr>
            <th>تاریخ</th>
            <th>ورود</th>
            <th>خروج</th>
          </tr>
        </thead>

        <tbody id="records"></tbody>
      </table>
    </div>

    <button class="clear" onclick="clearRecords()">
      🗑 پاک کردن همه سوابق
    </button>

  </div>

</div>

<script>
